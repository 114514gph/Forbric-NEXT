// Root build file — shared configuration for every subproject.
subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'

    group = 'net.forbric.next'
    version = '0.1.0-SNAPSHOT'

    java {
        // Forbric-NEXT targets JDK 21 LTS (records, pattern matching, sealed types).
        // The game itself may need a newer JRE, but the loader bytecode only needs 21.
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-deprecation,-unchecked']
    }

    test {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
        testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.10.2')
    }
}
