# NeoForbric 跨版本重映射示例表
# 版本对：1.20.4 → 26.3
#
# 格式：
#   class.老内部名=新内部名   （类名映射，斜杠分隔；点号形式也接受）
#   field.老字段名=新字段名   （字段名映射，骨架阶段只读不写回字节码，TODO）
#   method.老方法名=新方法名  （方法名映射，同上，TODO）
#
# 下面是几个示意条目（老 mod 里常见的 SRG / 混淆名 → 新映射名），
# 真实映射表在后续迭代里由 tiny-remapper 导出或手写补全。

# 示例：老版本里 Player 实体的混淆名 class_1657 在新版本里改了内部路径
# class.net/minecraft/class_1657 = net/minecraft/world/entity/player/Player

# 示例：某个老 mod 引用的内部工具类
# class.com/example/old/Helper = net/forbric/runtime/CompatHelper
